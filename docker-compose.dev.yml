# Development services only (docs/development/development-setup.md#3-dev-services-docker-composedevyml).
# The app runs on the host. These PostgreSQL containers are a development convenience, never a
# production database: production always uses an external PostgreSQL (docs/infrastructure/postgresql.md).
# The S3 test server (formerly MinIO, whose images are no longer public) returns with OQ-23 (open-questions.md).
name: monevo-dev

services:
  db:
    # Any supported major works here. Kept at 17 because a persistent data volume can't be opened by
    # an older major; the tests run on db-test at the minimum.
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: monevo
      POSTGRES_PASSWORD: monevo
      POSTGRES_DB: monevo_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monevo -d monevo_dev']
      interval: 5s
      timeout: 3s
      retries: 20

  db-test:
    # Minimum supported PostgreSQL major (MIN_SUPPORTED_MAJOR in apps/server/src/infra/database.ts).
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  mock-idp:
    # Test-only mock OpenID Provider standing in for Account Center (tools/mock-idp). Never production.
    image: node:24-alpine
    command: ['node', '/mock-idp/server.mjs']
    environment:
      MOCK_IDP_PORT: '9400'
      MOCK_IDP_ISSUER: http://localhost:9400
      MOCK_IDP_CLIENT_ID: monevo-dev
      MOCK_IDP_CLIENT_SECRET: monevo-dev-secret
      MOCK_IDP_REDIRECT_URIS: http://localhost:5173/api/v1/auth/oidc/callback
      MOCK_IDP_POST_LOGOUT_REDIRECT_URIS: http://localhost:5173/login
    volumes:
      - ./tools/mock-idp:/mock-idp:ro
    ports:
      - '127.0.0.1:9400:9400'

volumes:
  db:

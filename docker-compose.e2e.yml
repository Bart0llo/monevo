# Local end-to-end tests (docs/development/testing-strategy.md#5-local-validation), driven by
# `pnpm test:e2e`. The PostgreSQL service here is a disposable test fixture, never a production setup.
# No S3 service until a MinIO replacement is chosen (docs/planning/open-questions.md, OQ-23).
name: monevo-e2e

services:
  db:
    # Minimum supported PostgreSQL major (MIN_SUPPORTED_MAJOR in apps/server/src/infra/database.ts).
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: monevo
      POSTGRES_PASSWORD: monevo
      POSTGRES_DB: monevo
    command:
      ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monevo -d monevo']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: monevo:e2e
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_URL: http://localhost:3100
      INSECURE_COOKIES: 'true'
      # Test-only key (32 bytes, base64); never use it for a real instance.
      APP_ENCRYPTION_KEY: ZTJlLW9ubHktbW9uZXZvLWVuY3J5cHRpb24ta2V5ISE=
      DATABASE_URL: postgresql://monevo:monevo@db:5432/monevo
      LOG_LEVEL: info
      OIDC_ISSUER: http://localhost:9400
      OIDC_CLIENT_ID: monevo-e2e
      OIDC_CLIENT_SECRET: monevo-e2e-secret
      OIDC_DISPLAY_NAME: Mock IdP
      OIDC_ADMIN_GROUP: monevo-admins
    ports:
      - '127.0.0.1:3100:3000'
      # The mock-idp service runs in this container's network namespace.
      - '127.0.0.1:9400:9400'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: '1000:1000'

  mock-idp:
    # Test-only mock OpenID Provider (tools/mock-idp), run with the app image's node. It shares the app
    # container's network namespace, so http://localhost:9400 is the same issuer for the browser
    # (via the port published on app) and for the server.
    image: monevo:e2e
    network_mode: service:app
    depends_on:
      - app
    entrypoint: ['node', '/mock-idp/server.mjs']
    environment:
      MOCK_IDP_PORT: '9400'
      MOCK_IDP_ISSUER: http://localhost:9400
      MOCK_IDP_CLIENT_ID: monevo-e2e
      MOCK_IDP_CLIENT_SECRET: monevo-e2e-secret
      MOCK_IDP_REDIRECT_URIS: http://localhost:3100/api/v1/auth/oidc/callback
      MOCK_IDP_POST_LOGOUT_REDIRECT_URIS: http://localhost:3100/login
    volumes:
      - ./tools/mock-idp:/mock-idp:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: '1000:1000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9400/.well-known/openid-configuration').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
